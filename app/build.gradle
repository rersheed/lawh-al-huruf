plugins { id 'com.android.application' }

android {
    namespace 'com.lawh.huruf'
    compileSdk 34

    defaultConfig {
        applicationId "com.lawh.huruf"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Uses the debug key so the release APK installs directly on a phone.
            // Replace with your own keystore before publishing to Google Play.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
